name: Release

# Push a tag vX.Y.Z (matching package.json) to publish a version installable from the panel
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version ($expected). Run: npm version <x.y.z>"
            exit 1
          fi

      - name: Lint and test the bot
        env:
          TEST_DATABASE_URL: postgres://postgres:root@127.0.0.1:5432/postgres
        run: |
          npm ci
          npm run lint
          npm test

      - name: Build the panel
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Package
        run: |
          tar -czf "bot-$GITHUB_REF_NAME.tar.gz" \
            src assets launcher launcher.js scripts/migrate-sqlite.mjs web/dist package.json package-lock.json .npmrc .env.example README.md docs/pterodactyl.md docs/architecture.md

      - name: Release notes
        run: |
          schema=$(ls src/db/migrations | grep -E '^[0-9]+_.*\.sql$' | sort | tail -1 | cut -d_ -f1 | sed 's/^0*//')
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            if [ -n "$previous" ]; then
              echo "Changements depuis $previous :"
              git log --pretty='- %s' "$previous..$GITHUB_REF_NAME" --no-merges
            else
              echo "Première version."
            fi
            echo
            echo "<!-- schema:${schema:-0} -->"
          } > notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "bot-$GITHUB_REF_NAME.tar.gz" --title "$GITHUB_REF_NAME" --notes-file notes.md

  # Same version as a Docker image (docker-compose.yml): ghcr.io/<owner>/<repo>:vX.Y.Z and :latest
  image:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.ref_name }}
            ${{ steps.name.outputs.image }}:latest
